<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seriesmith</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css" />
    <script>
      try { if (localStorage.getItem("seriesmith.theme") === "light") document.documentElement.classList.add("light"); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <style>:root{--comfy-menu-bg:#1b1a18;--comfy-menu-secondary-bg:#161513;--comfy-input-bg:#1f1d1b;--fg-color:#ece6dc;--descrip-text:#a39b8f;--border-color:#38342f;--p-primary-color:#6cc7bc;--p-primary-contrast-color:#10201e;--content-hover-bg:#ffffff12;--error-text:#ff7a6e;--sm-card:#24221f;--sm-card-border:#2f2c28;--sm-shadow:none;--sm-field:#1c1b19;--sm-chip:#1d3936;--sm-chip-fg:#a8e2da;--sm-primary:#237a73;--sm-primary-fg:#fff;--sm-sans:"DM Sans", system-ui, sans-serif;--sm-serif:"Newsreader", Georgia, serif;--sm-page:#141311;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}:root.light{--comfy-menu-bg:#f6f3ee;--comfy-menu-secondary-bg:#ece7df;--comfy-input-bg:#fff;--fg-color:#23211e;--descrip-text:#6e675d;--border-color:#e2dcd2;--p-primary-color:#1f6f6a;--p-primary-contrast-color:#fff;--content-hover-bg:#0000000d;--error-text:#b42318;--sm-card:#fff;--sm-card-border:#ebe5dc;--sm-shadow:0 1px 3px #00000014;--sm-field:#faf8f4;--sm-chip:#e6f1ef;--sm-chip-fg:#15504c;--sm-primary:#1f6f6a;--sm-primary-fg:#fff;--sm-page:#ece7df;--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light}html,body{height:100%;font-family:var(--sm-sans);background:var(--sm-page);color:var(--fg-color);margin:0}#sm{grid-template:"top top"40px"side view"minmax(0,1fr)"side time"minmax(160px,30vh)/minmax(300px,380px) minmax(0,1fr);height:100vh;display:grid}#sm-top{background:var(--comfy-menu-bg);border-bottom:1px solid var(--border-color);grid-area:top;align-items:center;gap:12px;padding:0 12px;display:flex}#sm-top b{font-family:var(--sm-serif);letter-spacing:.01em;font-size:18px;font-weight:600}#sm-top .spacer{flex:auto}#sm-top button{color:var(--fg-color);border:1px solid var(--border-color);cursor:pointer;font:inherit;background:0 0;border-radius:8px;padding:4px 12px;font-size:12px}#sm-conn{background:#888;border-radius:50%;width:8px;height:8px}#sm-conn[data-state=on]{background:var(--p-primary-color)}#sm-conn[data-state=off]{background:var(--error-text)}#sm-side{background:var(--comfy-menu-bg);border-right:1px solid var(--border-color);flex-direction:column;grid-area:side;min-height:0;display:flex}#sm-tabs{border-bottom:1px solid var(--border-color);flex:none;display:flex}#sm-tabs button{color:var(--descrip-text);font:inherit;cursor:pointer;background:0 0;border:0;border-bottom:2px solid #0000;flex:1 1 0;padding:8px 0;font-size:13px;font-weight:500}#sm-tabs button.on{color:var(--fg-color);border-bottom-color:var(--p-primary-color)}#sm-shots,#sm-refs{flex:auto;min-height:0}#sm-view{background:#0d0c0b;grid-area:view;min-width:0;min-height:0;position:relative}#sm-view .empty{color:#8a8276;text-align:center;justify-content:center;align-items:center;padding:20px;font-size:14px;line-height:1.6;display:flex;position:absolute;inset:0}#sm-viewer{z-index:1;position:absolute;inset:0}.sm-split{background:0 0;transition:background .15s}.sm-split:hover,.sm-split.on{background:var(--p-primary-color);opacity:.6}#sm-viewer:empty{display:none}#sm-time{border-top:1px solid var(--border-color);background:var(--comfy-menu-secondary-bg);grid-area:time;min-height:0}#sm-timeline{height:100%}#sm-queue{align-items:center;gap:10px;display:flex}@media (max-width:760px){#sm{grid-template:"top"40px"view"45vh"side"minmax(0,1fr)"time"30vh/1fr}}</style>
    <script type="module" crossorigin src="/assets/standalone-BUS_cagx.js"></script>
  </head>
  <body>
    <div id="sm">
      <header id="sm-top">
        <b>seriesmith</b>
        <span class="spacer"></span>
        <span id="sm-queue"></span>
        <span id="sm-conn" title="connection to the seriesmith server"></span>
        <button id="sm-settings" title="This machine's settings: the Comfy API key, ComfyUI, deployments">Settings</button>
        <button id="sm-theme" title="Light / dark">Theme</button>
      </header>
      <aside id="sm-side">
        <nav id="sm-tabs">
          <button data-tab="shots">Shots</button>
          <button data-tab="refs">Refs</button>
        </nav>
        <div id="sm-shots"></div>
        <div id="sm-refs" hidden></div>
      </aside>
      <main id="sm-view">
        <div class="empty">Open an episode, then double-click a take<br />(or select a shot and press the play icon) to view it here.</div>
        <div id="sm-viewer"></div>
      </main>
      <section id="sm-time"><div id="sm-timeline"></div></section>
    </div>
  </body>
</html>
