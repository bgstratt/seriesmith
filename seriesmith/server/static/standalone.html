<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seriesmith</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css" />
    <script>
      try { if (localStorage.getItem("seriesmith.theme") === "light") document.documentElement.classList.add("light"); } catch (e) {}
    </script>
    <style>:root{--comfy-menu-bg:#2b2b2e;--comfy-menu-secondary-bg:#222225;--comfy-input-bg:#1c1c1f;--fg-color:#ececec;--descrip-text:#9a9aa0;--border-color:#3c3c42;--p-primary-color:#34d399;--p-primary-contrast-color:#111;--content-hover-bg:#ffffff14;--error-text:#ff5a5a;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}:root.light{--comfy-menu-bg:#e9e9ec;--comfy-menu-secondary-bg:#dcdce0;--comfy-input-bg:#fff;--fg-color:#1d1d20;--descrip-text:#55555c;--border-color:#b9b9c0;--p-primary-color:#0f9f6e;--p-primary-contrast-color:#fff;--content-hover-bg:#00000010;--error-text:#c41a1a;--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light}html,body{height:100%;color:var(--fg-color);background:#141416;margin:0;font-family:Inter,system-ui,sans-serif}:root.light body{background:#f2f2f4}#sm{grid-template:"top top"40px"side view"minmax(0,1fr)"time time"minmax(160px,30vh)/minmax(300px,380px) minmax(0,1fr);height:100vh;display:grid}#sm-top{background:var(--comfy-menu-bg);border-bottom:1px solid var(--border-color);grid-area:top;align-items:center;gap:12px;padding:0 12px;display:flex}#sm-top b{letter-spacing:.02em;font-size:14px}#sm-top .spacer{flex:auto}#sm-top button{color:var(--fg-color);border:1px solid var(--border-color);cursor:pointer;font:inherit;background:0 0;border-radius:6px;padding:4px 10px;font-size:12px}#sm-conn{background:#888;border-radius:50%;width:8px;height:8px}#sm-conn[data-state=on]{background:var(--p-primary-color)}#sm-conn[data-state=off]{background:var(--error-text)}#sm-side{background:var(--comfy-menu-bg);border-right:1px solid var(--border-color);flex-direction:column;grid-area:side;min-height:0;display:flex}#sm-tabs{border-bottom:1px solid var(--border-color);flex:none;display:flex}#sm-tabs button{color:var(--descrip-text);font:inherit;cursor:pointer;background:0 0;border:0;border-bottom:2px solid #0000;flex:1 1 0;padding:8px 0;font-size:13px}#sm-tabs button.on{color:var(--fg-color);border-bottom-color:var(--p-primary-color)}#sm-shots,#sm-refs{flex:auto;min-height:0}#sm-view{background:#000;grid-area:view;min-width:0;min-height:0;position:relative}#sm-view .empty{color:#777;text-align:center;justify-content:center;align-items:center;padding:20px;font-size:13px;display:flex;position:absolute;inset:0}#sm-viewer{z-index:1;position:absolute;inset:0}#sm-viewer:empty{display:none}#sm-time{border-top:1px solid var(--border-color);background:var(--comfy-menu-secondary-bg);grid-area:time;min-height:0}#sm-timeline{height:100%}#sm-queue{align-items:center;gap:10px;display:flex}.sm-backend{color:var(--descrip-text);align-items:center;gap:6px;font-size:12px;display:flex}.sm-backend select{background:var(--comfy-input-bg);color:var(--fg-color);border:1px solid var(--border-color);font:inherit;border-radius:6px;padding:3px 6px}.sm-jobs-btn{align-items:center;gap:8px;display:flex}.sm-bar{background:var(--border-color);border-radius:3px;width:90px;height:6px;display:inline-block;overflow:hidden}.sm-bar.wide{width:100%;margin-top:4px;display:block}.sm-bar>span{background:var(--p-primary-color);height:100%;transition:width .3s;display:block}.sm-jobs{flex:auto;min-height:0;padding:4px 0;overflow:auto}.sm-lane>header{border-bottom:1px solid var(--border-color);background:var(--comfy-menu-secondary-bg);align-items:center;gap:8px;padding:6px 10px;display:flex;position:sticky;top:0}.sm-job{border-bottom:1px solid var(--border-color);padding:6px 10px}.sm-job-row{align-items:center;gap:6px;display:flex}.sm-job-title{font-size:12px;font-weight:600}.sm-job.sm-failed .sm-job-title{color:var(--error-text)}.sm-job.sm-succeeded .sm-job-title,.sm-job.sm-canceled .sm-job-title{color:var(--descrip-text)}.sm-log{background:var(--comfy-input-bg);white-space:pre-wrap;border-radius:4px;max-height:160px;margin:6px 0 0;padding:6px;font-size:11px;overflow:auto}@media (max-width:760px){#sm{grid-template:"top"40px"view"45vh"side"minmax(0,1fr)"time"30vh/1fr}}</style>
    <script type="module" crossorigin src="/assets/standalone-BwWKJBjY.js"></script>
  </head>
  <body>
    <div id="sm">
      <header id="sm-top">
        <b>seriesmith</b>
        <span class="spacer"></span>
        <span id="sm-queue"></span>
        <span id="sm-conn" title="connection to the seriesmith server"></span>
        <button id="sm-theme" title="Light / dark">Theme</button>
      </header>
      <aside id="sm-side">
        <nav id="sm-tabs">
          <button data-tab="shots">Shots</button>
          <button data-tab="refs">Refs</button>
        </nav>
        <div id="sm-shots"></div>
        <div id="sm-refs" hidden></div>
      </aside>
      <main id="sm-view">
        <div class="empty">Open an episode, then double-click a take<br />(or select a shot and press the play icon) to view it here.</div>
        <div id="sm-viewer"></div>
      </main>
      <section id="sm-time"><div id="sm-timeline"></div></section>
    </div>
  </body>
</html>
