[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriesmith"
version = "0.1.2"
description = "Write the show, get the episodes: an AI video editor inside ComfyUI. Script your shots, keep characters and places consistent with reference pictures, render each shot on any model (your GPU, Comfy Cloud or Router), then cut, upscale and master."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["comfy-sdk>=0.4,<0.5", "pillow>=10", "numpy>=1.24", "aiohttp>=3.9",
                "imageio-ffmpeg>=0.5", "av>=17"]

[project.urls]
Repository = "https://github.com/bgstratt/seriesmith"
Documentation = "https://docs.seriesmith.com"
"Bug Tracker" = "https://github.com/bgstratt/seriesmith/issues"

# the Comfy Registry's listing (ComfyUI-Manager): the whole repo is the node
# pack (__init__.py), less .comfyignore; Manager installs requirements.txt
[tool.comfy]
PublisherId = "bgstratt"
DisplayName = "seriesmith"
Icon = "https://raw.githubusercontent.com/bgstratt/seriesmith/main/docs/site/favicon.png"
includes = []

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.scripts]
seriesmith = "seriesmith.cli:main"

[tool.setuptools.packages.find]
include = ["seriesmith*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md"]
# the presets' sample pictures (seriesmith/presets/img/, tools/make_preset_samples.py)
"seriesmith.presets" = ["img/*/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# in parallel by default (pytest-xdist, the `test` extra): the whole suite on every
# core in about a minute; a few named files run in-process (tests/conftest.py's
# pytest_xdist_auto_num_workers); `-n 0` forces one process, `-n 8` eight
addopts = "-n auto"
required_plugins = ["pytest-xdist"]
