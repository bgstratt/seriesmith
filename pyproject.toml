[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriesmith"
version = "0.1.0"
description = "A series config and episode scripts in, finished episodes out: any shot on any model, local or on Comfy's cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["comfy-sdk>=0.4,<0.5", "pillow>=10", "numpy>=1.24", "aiohttp>=3.9",
                "imageio-ffmpeg>=0.5", "av>=17"]

[project.urls]
Repository = "https://github.com/bgstratt/seriesmith"
Documentation = "https://docs.seriesmith.com"
"Bug Tracker" = "https://github.com/bgstratt/seriesmith/issues"

# the Comfy Registry's listing (ComfyUI-Manager): the whole repo is the node
# pack (__init__.py), less .comfyignore; Manager installs requirements.txt
[tool.comfy]
PublisherId = "bgstratt"
DisplayName = "seriesmith"
Icon = "https://raw.githubusercontent.com/bgstratt/seriesmith/main/docs/site/favicon.png"
includes = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
seriesmith = "seriesmith.cli:main"

[tool.setuptools.packages.find]
include = ["seriesmith*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md"]
# the presets' sample pictures (seriesmith/presets/img/, tools/make_preset_samples.py)
"seriesmith.presets" = ["img/*/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
