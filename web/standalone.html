<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seriesmith</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css" />
    <script>
      try { if (localStorage.getItem("seriesmith.theme") === "light") document.documentElement.classList.add("light"); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <style>
      /* the theme variables the editor reads: ComfyUI's names (which it uses inside
         ComfyUI) and seriesmith's own (--sm-*: cards, chips, the primary button, the
         serif), which fall back to ComfyUI's inside it. Warm paper, light and dark. */
      :root {
        --comfy-menu-bg: #1b1a18; --comfy-menu-secondary-bg: #161513; --comfy-input-bg: #1f1d1b;
        --fg-color: #ece6dc; --descrip-text: #a39b8f; --border-color: #38342f; --p-primary-color: #6cc7bc;
        --p-primary-contrast-color: #10201e; --content-hover-bg: #ffffff12; --error-text: #ff7a6e;
        --sm-card: #24221f; --sm-card-border: #2f2c28; --sm-shadow: none;
        --sm-field: #1c1b19; --sm-chip: #1d3936; --sm-chip-fg: #a8e2da;
        --sm-primary: #237a73; --sm-primary-fg: #fff;
        --sm-sans: "DM Sans", system-ui, sans-serif; --sm-serif: "Newsreader", Georgia, serif;
        --sm-page: #141311;
        color-scheme: dark;
      }
      :root.light {
        --comfy-menu-bg: #f6f3ee; --comfy-menu-secondary-bg: #ece7df; --comfy-input-bg: #fff;
        --fg-color: #23211e; --descrip-text: #6e675d; --border-color: #e2dcd2; --p-primary-color: #1f6f6a;
        --p-primary-contrast-color: #fff; --content-hover-bg: #0000000d; --error-text: #b42318;
        --sm-card: #fff; --sm-card-border: #ebe5dc; --sm-shadow: 0 1px 3px #00000014;
        --sm-field: #faf8f4; --sm-chip: #e6f1ef; --sm-chip-fg: #15504c;
        --sm-primary: #1f6f6a; --sm-primary-fg: #fff;
        --sm-page: #ece7df;
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; font-family: var(--sm-sans); background: var(--sm-page); color: var(--fg-color); }
      #sm {
        display: grid; height: 100vh;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
        grid-template-rows: 40px minmax(0, 1fr) minmax(160px, 30vh);
        grid-template-areas: "top top" "side view" "time time";
      }
      #sm-top {
        grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 12px;
        background: var(--comfy-menu-bg); border-bottom: 1px solid var(--border-color);
      }
      #sm-top b { font-family: var(--sm-serif); font-size: 18px; font-weight: 600; letter-spacing: .01em; }
      #sm-top .spacer { flex: 1 1 auto; }
      #sm-top button {
        background: transparent; color: var(--fg-color); border: 1px solid var(--border-color);
        border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 12px;
      }
      #sm-conn { width: 8px; height: 8px; border-radius: 50%; background: #888; }
      #sm-conn[data-state="on"] { background: var(--p-primary-color); }
      #sm-conn[data-state="off"] { background: var(--error-text); }
      #sm-side {
        grid-area: side; display: flex; flex-direction: column; min-height: 0;
        background: var(--comfy-menu-bg); border-right: 1px solid var(--border-color);
      }
      #sm-tabs { display: flex; border-bottom: 1px solid var(--border-color); flex: 0 0 auto; }
      #sm-tabs button {
        flex: 1 1 0; background: transparent; color: var(--descrip-text); border: 0; padding: 8px 0;
        font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
      }
      #sm-tabs button.on { color: var(--fg-color); border-bottom-color: var(--p-primary-color); }
      #sm-shots, #sm-refs { flex: 1 1 auto; min-height: 0; }
      #sm-view { grid-area: view; position: relative; min-width: 0; min-height: 0; background: #0d0c0b; }
      #sm-view .empty {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #8a8276; font-size: 14px; line-height: 1.6; text-align: center; padding: 20px;
      }
      #sm-viewer { position: absolute; inset: 0; z-index: 1; }
      /* the splitters (src/splitters.ts): a line on hover and while dragging */
      .sm-split { background: transparent; transition: background .15s; }
      .sm-split:hover, .sm-split.on { background: var(--p-primary-color); opacity: .6; }
      #sm-viewer:empty { display: none; }
      #sm-time { grid-area: time; min-height: 0; border-top: 1px solid var(--border-color); background: var(--comfy-menu-secondary-bg); }
      #sm-timeline { height: 100%; }
      /* the queue: top bar controls, the Jobs window */
      #sm-queue { display: flex; align-items: center; gap: 10px; }
      @media (max-width: 760px) {
        #sm { grid-template-columns: 1fr; grid-template-rows: 40px 45vh minmax(0, 1fr) 30vh;
              grid-template-areas: "top" "view" "side" "time"; }
      }
    </style>
  </head>
  <body>
    <div id="sm">
      <header id="sm-top">
        <b>seriesmith</b>
        <span class="spacer"></span>
        <span id="sm-queue"></span>
        <span id="sm-conn" title="connection to the seriesmith server"></span>
        <button id="sm-settings" title="This machine's settings: the Comfy API key, ComfyUI, deployments">Settings</button>
        <button id="sm-theme" title="Light / dark">Theme</button>
      </header>
      <aside id="sm-side">
        <nav id="sm-tabs">
          <button data-tab="shots">Shots</button>
          <button data-tab="refs">Refs</button>
        </nav>
        <div id="sm-shots"></div>
        <div id="sm-refs" hidden></div>
      </aside>
      <main id="sm-view">
        <div class="empty">Open an episode, then double-click a take<br />(or select a shot and press the play icon) to view it here.</div>
        <div id="sm-viewer"></div>
      </main>
      <section id="sm-time"><div id="sm-timeline"></div></section>
    </div>
    <script type="module" src="/src/standalone.tsx"></script>
  </body>
</html>
